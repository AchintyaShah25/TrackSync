[project]
name = "tracksync"
version = "0.1.0"
description = "TrackSync: unofficial F1 analytics hub (workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/racemodel", "services/api", "services/etl"]

[tool.uv.sources]
racemodel = { workspace = true }

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs the local Postgres (supabase db start)"]
