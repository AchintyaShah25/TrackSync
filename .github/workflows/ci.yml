name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same commands as local: the Makefile keeps uv/pnpm/Supabase state in .tools.
      - name: Bootstrap toolchain
        run: make bootstrap
      - name: Lint
        run: make lint-py
      - name: Start local Postgres (Supabase CLI)
        run: make db-up
      - name: Tests
        run: make test-py

  web:
    name: Web (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Static showcase pages are built from recorded API snapshots (decision 0010).
      - name: Build from fixtures
        run: pnpm build
        env:
          SHOWCASE_FIXTURES: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
