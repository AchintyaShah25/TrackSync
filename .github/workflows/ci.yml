name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tags since v10
        with:
          version: "0.11.18"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Same commands as local: the Makefile keeps uv/pnpm/Supabase state in .tools.
      - name: Bootstrap toolchain
        run: make bootstrap
      - name: Lint
        run: make lint-py
      - name: Start local Postgres (Supabase CLI)
        run: make db-up
      - name: Tests
        run: make test-py

  web:
    name: Web (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Static showcase pages are built from recorded API snapshots (decision 0010).
      - name: Build from fixtures
        run: pnpm build
        env:
          SHOWCASE_FIXTURES: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
      # Showcase pages must render with no API (Playwright builds again with a dead API URL).
      - name: Install Chromium for Playwright
        run: pnpm e2e:install --with-deps
      - name: End-to-end showcase tests
        run: pnpm e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: apps/web/test-results/
          retention-days: 7
