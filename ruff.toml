target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache", "apps"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID251"]

[lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[lint.flake8-tidy-imports.banned-api]
# Architecture rule 1: FastF1 runs only in services/etl (see docs/decisions/0001).
"fastf1".msg = "FastF1 may only be imported in services/etl."

[lint.per-file-ignores]
"services/etl/**" = ["TID251"]
