[project]
name = "tracksync-etl"
version = "0.1.0"
description = "TrackSync ETL: FastF1 + Jolpica ingestion into Postgres"
requires-python = ">=3.12"
dependencies = [
  "fastf1",
  "sqlalchemy",
  "psycopg[binary]",
  "requests",  # already a FastF1 dependency; used directly by the OpenF1 client
  "racemodel",
]

[project.scripts]
tracksync-etl = "tracksync_etl.cli:main"

[tool.uv.sources]
racemodel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracksync_etl"]
