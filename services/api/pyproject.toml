[project]
name = "tracksync-api"
version = "0.1.0"
description = "TrackSync REST API: serves precomputed F1 data from Postgres"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "pydantic-settings",
  "racemodel",
]

[tool.uv.sources]
racemodel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
